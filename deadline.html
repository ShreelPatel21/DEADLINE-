<style>
:root{--bg:#F5F5EB;--card:#FFFEF8;--side:#FFFEF8;--pri:#8BA888;--sec:#6F8F72;--soft:#E5EBDD;--tx:#344638;--tx2:#5F6E61;--bd:#E2E7DA;--btn:#55785A;--onb:#fff;--ok:#4D9567;--warn:#B88A3B;--err:#C65B5B;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

om{opacity:0;transform:translateY(10px) scale(.97)}}@keyframes dlgout{to{opacity:0;transform:translateY(6px) scale(.98)}}@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}.err:not(:empty){animation:fadein .2s ease-out}#toast{transform:translate(-50%,10px);transition:opacity .2s var(--ease),transform .26s var(--ease)}#toast.on{transform:translate(-50%,0)}.tt,.tt *,.tt ::before,.tt ::after{transition:background-color .22s ease,color .22s ease,border-color .22s ease,fill .22s ease,stroke .22s ease!important}.sw{transition:border-color .18s,background-color .18s,transform .18s var(--ease)}.sw:has(:checked){transform:scale(1.02)}.rw{position:relative;width:min(260px,72vw);margin:14px auto}.rw svg{display:block;width:100%;transform:rotate(-90deg)}.rb,.rf{fill:none;stroke-width:7}.rb{stroke:var(--soft)}.rf{stroke:var(--sec);stroke-linecap:round;stroke-dasharray:339.3;transition:stroke-dashoffset .3s linear}.rw #tm{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:clamp(2.2rem,9vw,3.4rem)}.pb i{transform-origin:left center}.ch2 rect{transform-box:fill-box;transform-origin:50% 100%}.empty::before{content:'';display:block;width:26px;height:26px;margin:0 auto 10px;border-radius:0 100%;background:var(--pri);opacity:.85;animation:leaf .5s var(--ease) backwards}@keyframes leaf{from{opacity:0;transform:translateY(6px) rotate(-12deg) scale(.8)}}@media(max-width:800px){.ind{display:none}.navw{flex:1;min-width:0}}@media(prefers-reduced-motion:reduce){*::before,*::after,dialog::backdrop{animation:none!important;transition:none!important}}.rm *::before,.rm *::after,.rm dialog::backdrop{animation:none!important;transition:none!important}
:root{--bg:#101a14;--card:#1a2a22;--side:#15231c;--pri:#97dfa0;--sec:#5fb078;--soft:#243a2f;--tx:#e7f2ec;--tx2:#a3bbab;--bd:#2c4437;--btn:#8fdc9f;--onb:#0d1a12;--ok:#97dfa0;--warn:#e3bc70;--err:#e58a8a;--glow:color-mix(in srgb,var(--pri) 24%,transparent);--shadow:0 14px 34px -18px rgba(5,25,15,.55);color-scheme:dark}

.side{border:1px solid var(--bd);border-radius:26px;padding:18px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--side) 90%,var(--pri)),var(--side));box-shadow:var(--shadow)}

.top h1{font-size:1.5rem;letter-spacing:-.01em}
#view{padding-top:24px}

.brand{font-size:1.2rem}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--sec));color:#0d1a12;box-shadow:0 0 0 4px var(--glow)}
.av{background:linear-gradient(135deg,var(--pri),var(--sec));color:#0d1a12}

#nav{gap:4px}

.ind{background:linear-gradient(var(--pri),var(--sec));box-shadow:0 0 12px var(--glow)}

.card{padding:18px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--card) 94%,#fff),var(--card));box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05)}
.card h2{font-size:1.1rem}
.stat{position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pri) 14%,transparent),transparent 70%);pointer-events:none}
.stat>*{position:relative;z-index:1}

.btn{border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--btn) 78%,#fff),var(--btn));box-shadow:0 8px 18px -10px var(--btn)}

.b{background:color-mix(in srgb,var(--pri) 14%,transparent)}

@media(max-width:800px){
  body{padding:0;gap:0}

  .msg{max-width:92%}
  #nav button{flex:none;min-width:66px;padding:6px 8px;text-align:center;line-height:1.15}

</style></head><body>

const tp=D.tasks.filter(t=>t.subj==s&&!dn(t)&&t.cat!="Exam").sort((a,b)=>PRI.indexOf(b.pri)-PRI.indexOf(a.pri)||W(a.due)-W(b.due)).map(t=>t.title);if(!tp.length)tp.push("Revision of "+sn(s));
const rows=[];let r=0;for(let i=1;i<=Math.min(Math.max(n-1,1),21);i++){const x=W(dk(N())+"T00:00");x.setDate(x.getDate()+i);const m={};let left=h*60;while(left>0){const b=Math.min(50,left),l=tp[r++%tp.length];m[l]=(m[l]||0)+b;left-=b}for(const l in m)rows.push({d:dk(x),l,m:m[l]})}U.plan={s,d,h,rows};render();rise($$('form[data-form=addp] .tr'),{y:8,d:300,g:40})}
else if(k=="addp"){const P=U.plan,c={};let n=0;$$(".tr",f).forEach((r,i)=>{if(!$("[type=checkbox]",r).checked)return;const x=P.rows[i],j=c[x.d]=c[x.d]||0;c[x.d]++;upsert("",{...blank,title:"Study: "+x.l,desc:"Suggested by the study planner",subj:P.s,cat:"Study",due:`${x.d}T${pad(Math.min(22,17+j))}:00`,est:Math.max(15,+$("[type=number]",r).value||x.m),updated:Date.now()});n++});U.plan=null;toast(n?`${n} study block${n>1?"s":""} added to your calendar`:"No blocks selected");render()}});
document.addEventListener("change",e=>{const t=e.target,k=t.dataset.pref;
if(k){D.prefs[k]=t.type=="checkbox"?t.checked:t.type=="number"?Math.max(+t.min||0,Math.min(+t.max||999,+t.value||+t.min||1)):t.value.trim();if(t.type=="number")t.value=D.prefs[k];save();if(k=="rm")document.documentElement.classList.toggle("rm",D.prefs.rm);if(["foc","sb","lb"].includes(k)&&!FT.run)FT.left=dur(FT.mode);shell()}
else if(t.dataset.f){t.dataset.f=="sort"?U.sort=t.value:U.f[t.dataset.f]=t.value;$("#tl").innerHTML=tlist();rise([$('#tl')],{y:4,d:180,g:0})}
else if(t.dataset.ft)FT.task=t.value;else if(t.dataset.ar){U.ar=+t.value;render(true)}
else if(t.name=="pal")setTheme(+t.value,TH.m);else if(t.name=="mode")setTheme(TH.p,t.value)});
$("#gs").addEventListener("input",e=>{U.q=e.target.value;if(U.page!="tasks"){U.page="tasks";render()}else $("#tl").innerHTML=tlist()});
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey||dlg.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=="n"){e.preventDefault();taskDlg("")}else if(e.key=="/"){e.preventDefault();$("#gs").focus()}});
D.tt=D.tt||{};
D.note=D.note||{title:"Quick note",body:""};
D.chat=D.chat||[];

IC.time='<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M9 4v18M15 4v18"/>';
IC.note='<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>';
IC.bot='<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 13h.01M15 13h.01M9 17h6"/>';
IC.award='<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/>';

NAV.push(["timetable","Timetable","time"],["notes","Quick Notes","note"],["assistant","Study Assistant","bot"],["awards","Achievements","award"]);
const ORDER=["dashboard","tasks","calendar","timetable","planner","focus","notes","assistant","subjects","analytics","awards","settings"];
NAV.sort((a,b)=>ORDER.indexOf(a[0])-ORDER.indexOf(b[0]));

const SLOTS=["8:00 - 9:00","9:00 - 10:00","10:00 - 11:00","11:00 - 12:00","12:00 - 1:00","1:00 - 2:00","2:00 - 3:00","3:00 - 4:00","4:00 - 5:00"];
const WEEK=["Mon","Tue","Wed","Thu","Fri","Sat"];

function timetablePg(){
  D.tt=D.tt||{};
  const today=(N().getDay()+6)%7;
  const head=WEEK.map((d,i)=>`<th class="${i==today?"now":""}">${d}</th>`).join("");
  const rows=SLOTS.map((s,r)=>`<tr><th scope="row">${s}</th>${WEEK.map((d,c)=>`<td class="${c==today?"now":""}"><input data-tt="${r}_${c}" value="${esc(D.tt[r+"_"+c])}" maxlength="40" aria-label="${d} ${s}"></td>`).join("")}</tr>`).join("");
  return `<div class="card"><div class="row"><h2 style="margin-right:auto">Weekly timetable</h2><span class="mu">Type in any slot. It saves as you type.</span><button class="ghost" data-act="ttclear">Clear all</button></div><div class="tw mt"><table class="ttable"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function wordCount(t){
  t=t.trim();
  return t?t.split(/\s+/).length:0;
}

function notesPg(){
  const n=D.note||{title:"Quick note",body:""};
  return `<div class="card notes"><div class="row"><input class="nt" data-note="title" value="${esc(n.title)}" maxlength="60" aria-label="Note title"><span class="mu" id="ns">${n.body?"Saved":"Start typing"}</span></div><textarea data-note="body" rows="16" placeholder="Write your notes here. They save as you type." aria-label="Note text">${esc(n.body)}</textarea><p class="mu mt"><span id="nw">${wordCount(n.body)}</span> words</p></div>`;
}

const TIPS=[
  "Test yourself before re-reading. Write down what you remember, then check your notes.",
  "Study in short blocks. 25 minutes of focus and a 5 minute break works well.",
  "Start with the hardest subject while your mind is fresh.",
  "Explain a topic out loud as if you were teaching a friend.",
  "Put your phone in another room during a focus session.",
  "Sleep well before an exam. It helps memory more than one more hour of revision."
];
let tipNo=0;

function answer(q){
  q=q.toLowerCase();
  const open=D.tasks.filter(t=>!dn(t)).sort((a,b)=>W(a.due)-W(b.due));
  const line=t=>t.title+" ("+fD(t.due)+")";
  if(/^(hi|hello|hey)\b/.test(q))return "Hi! I can tell you what is due, check your progress, share study tips and help you plan.";
  if(/\boverdue\b|\blate\b|\bmissed\b/.test(q)){
    const o=open.filter(ov);
    return o.length?"Overdue: "+o.map(line).join(", ")+". Start with the oldest one.":"Nothing is overdue. Nice work.";
  }
  if(/\bdue\b|\bdeadlines?\b|\btoday\b|\bupcoming\b|\bnext\b/.test(q)){
    const a=open.filter(t=>!ov(t)).slice(0,4);
    return a.length?"Coming up: "+a.map(line).join(", ")+".":"You have no open deadlines. Add a task to get started.";
  }
  if(/\bprogress\b|\bstreak\b|how am i|\bstats?\b/.test(q))return "You have finished "+D.tasks.filter(dn).length+" tasks, studied "+(minsOn(dk(N()))/60).toFixed(1)+" hours today and your streak is "+streak()+" days.";
  if(/\b(plans?|planner|exams?|examinations?|prepare|schedule)\b/.test(q)){
    const e=open.find(t=>t.cat=="Exam");
    return (e?"Your next exam is "+line(e)+". ":"")+"Open the Study Planner, pick a subject and an exam date, and it builds a daily plan for you.";
  }
  if(/focus|pomodoro|concentrat|distract|timer/.test(q))return "Try the Focus Room: 25 minutes of work, then a 5 minute break. Keep your phone away and work on one task only.";
  if(/\b(tips?|study|learn\w*|memor\w*|revis\w*|remember)\b/.test(q))return TIPS[tipNo++%TIPS.length];
  return "I can help with deadlines, overdue work, progress, study plans, focus and study tips. Try one of those.";
}

function assistantPg(){
  D.chat=D.chat||[];
  const msgs=D.chat.length?D.chat:[{r:"a",t:"Hello! Ask me what is due, how your progress looks, or for a study tip."}];
  const chips=["What is due today?","Anything overdue?","How is my progress?","Give me a study tip","Focus tips"];
  return `<div class="card chat"><div class="log" id="log">${msgs.map(m=>`<p class="msg ${m.r}">${esc(m.t)}</p>`).join("")}</div><div class="row">${chips.map(c=>`<button class="ghost" data-act="ask" data-id="${c}">${c}</button>`).join("")}</div><form class="row mt" data-form="chat"><input name="q" placeholder="Ask about deadlines, plans or study tips" aria-label="Your question" maxlength="200" style="flex:1"><button class="btn">Send</button></form><p class="mu mt">A simple rule-based helper that runs on your device and reads your own tasks. It is not a generative AI model.</p></div>`;
}

function chatFocus(){
  const l=$("#log");
  if(l)l.scrollTop=l.scrollHeight;
  const i=$("[name=q]");
  if(i)i.focus();
}

function say(q){
  D.chat=D.chat||[];
  D.chat.push({r:"u",t:q});
  D.chat=D.chat.slice(-30);
  save();
  render();
  chatFocus();
  setTimeout(()=>{
    D.chat.push({r:"a",t:answer(q)});
    D.chat=D.chat.slice(-30);
    save();
    if(U.page=="assistant"){render();chatFocus()}
  },450);
}

const SW={run:false,start:0,base:0};
const swMs=()=>SW.base+(SW.run?Date.now()-SW.start:0);
const swText=()=>{
  const s=Math.floor(swMs()/1000);
  return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
};
setInterval(()=>{const e=$("#sw");if(e)e.textContent=swText()},250);

const swCard=()=>`<div class="card" style="text-align:center"><h2>Stopwatch</h2><p class="swt" id="sw">${swText()}</p><div class="row" style="justify-content:center"><button class="btn" id="swb" data-act="swgo">${SW.run?"Pause":"Start"}</button><button class="ghost" data-act="swrst">Reset</button></div><p class="mu mt">Count up when you do not want a fixed timer.</p></div>`;

function focusPg(){
  return focusBase()+swCard();
}

function dash(){
  return dashBase()+`<div class="card tipc"><h2>Study tip</h2><p>${esc(TIPS[N().getDate()%TIPS.length])}</p><button class="ghost" data-act="go" data-id="assistant">Ask the study assistant</button></div>`;
}

function achList(){
  const done=D.tasks.filter(okT).length,rs=D.sessions.filter(okS),mins=rs.reduce((a,s)=>a+s.mins,0),days=streak(),subs=D.subjects.filter(s=>!s.sample).length,slots=Object.values(D.tt||{}).filter(Boolean).length;
  return [["First step","Complete 1 task",done,1],["Task master","Complete 10 tasks",done,10],["Deadline hero","Complete 25 tasks",done,25],["On a roll","Keep a 3 day streak",days,3],["Unstoppable","Keep a 7 day streak",days,7],["Focused","Finish 5 focus sessions",rs.length,5],["Deep worker","Focus for 10 hours",Math.floor(mins/60),10],["Organised","Add 3 subjects",subs,3],["Timetable builder","Fill 10 timetable slots",slots,10]];
}
function unlock(){const A=D.ach=D.ach||{};let n=0;achList().forEach(a=>{if(a[2]>=a[3]&&!A[a[0]]){A[a[0]]=Date.now();n++}});return n}
function awardsPg(){
  if(unlock())save();
  const list=achList(),A=D.ach||{},got=list.filter(a=>A[a[0]]).length;
  const badge=([t,d,v,g])=>`<div class="card badge ${A[t]?"on":""}"><span class="medal" aria-hidden="true">${A[t]?"★":"☆"}</span><div><h3>${t}</h3><p class="mu">${d}</p><div class="pb"><i style="width:${Math.min(100,pct(v,g))}%"></i></div><small class="mu">${A[t]?"Earned "+fD(A[t]):Math.min(v,g)+" of "+g}</small></div></div>`;
  return `<div class="card" style="margin-bottom:14px"><h2>${got} of ${list.length} badges earned</h2><div class="pb mt"><i style="width:${pct(got,list.length)}%"></i></div><p class="mu mt">A day counts toward your streak when you finish a focus session or mark a task complete. Opening the app or using sample data never counts, and earned badges stay earned.</p></div><div class="grid g2">${list.map(badge).join("")}</div>`;
}

PG.timetable=timetablePg;
PG.notes=notesPg;
PG.assistant=assistantPg;
PG.awards=awardsPg;

ACT.ttclear=()=>confirmDlg("Clear the whole timetable? You can’t undo this.","ttok","","Clear");
ACT.ttok=()=>{D.tt={};save();closeDlg();toast("Timetable cleared");render()};
ACT.ask=q=>say(q);
ACT.swgo=()=>{
  if(SW.run){SW.base=swMs();SW.run=false}
  else{SW.start=Date.now();SW.run=true}
  const b=$("#swb");
  if(b)b.textContent=SW.run?"Pause":"Start";
};
ACT.swrst=()=>{
  SW.run=false;
  SW.base=0;
  const b=$("#swb"),e=$("#sw");
  if(b)b.textContent="Start";
  if(e)e.textContent=swText();
};

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.tt){
    D.tt=D.tt||{};
    D.tt[t.dataset.tt]=t.value;
    save();
  }else if(t.dataset.note){
    D.note=D.note||{title:"Quick note",body:""};
    D.note[t.dataset.note]=t.value;
    save();
    const s=$("#ns"),w=$("#nw");
    if(s)s.textContent="Saved "+fT(N());
    if(w)w.textContent=wordCount(D.note.body);
  }
});

document.addEventListener("submit",e=>{
  if(e.target.dataset.form=="chat"){
    const q=new FormData(e.target).get("q").trim();
    if(q)say(q);
  }
});

document.documentElement.classList.toggle("rm",!!D.prefs.rm);render();
</script></body></html>
